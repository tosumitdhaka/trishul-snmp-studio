[pytest]
testpaths = backend/tests
addopts = -q
markers =
    unit: Fast isolated tests for a single service or helper module.
    contract: Route/API contract tests that validate request and response behavior.
    integration: Cross-module workflow tests covering db, filesystem, and service boundaries.
    live: Slow end-to-end tests using live sockets/processes.
    slow: Tests that are intentionally slower than the default unit/contract suite.
