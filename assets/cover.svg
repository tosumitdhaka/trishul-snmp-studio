    <text x="22" y="24" fill="#F7FAFF" font-family="Ubuntu Sans, Ubuntu, Liberation Sans, sans-serif" font-size="16" font-weight="600">MIB Browser</text>
  </g>
  <g transform="translate(212 592)">
    <rect width="78" height="36" rx="18" fill="url(#cardFill)" stroke="#B9C8E4" stroke-opacity="0.16"/>
    <text x="24" y="24" fill="#F7FAFF" font-family="Ubuntu Sans, Ubuntu, Liberation Sans, sans-serif" font-size="16" font-weight="600">Traps</text>
  </g>
  <g transform="translate(304 592)">
    <rect width="126" height="36" rx="18" fill="url(#cardFill)" stroke="#B9C8E4" stroke-opacity="0.16"/>
    <text x="18" y="24" fill="#F7FAFF" font-family="Ubuntu Sans, Ubuntu, Liberation Sans, sans-serif" font-size="16" font-weight="600">MIB Manager</text>
