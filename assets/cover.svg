  <text x="72" y="310" fill="#F7FAFF" font-family="Ubuntu Sans, Ubuntu, Liberation Sans, sans-serif" font-size="74" font-weight="700">SNMP Suite</text>

  <text x="72" y="368" fill="#C8D2E5" font-family="Ubuntu Sans, Ubuntu, Liberation Sans, sans-serif" font-size="27" font-weight="400">SNMP lab for browsing, simulation, walks, traps,</text>
  <text x="72" y="402" fill="#C8D2E5" font-family="Ubuntu Sans, Ubuntu, Liberation Sans, sans-serif" font-size="27" font-weight="400">exports, and real vendor MIB workflows.</text>

